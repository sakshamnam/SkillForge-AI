const params = new URLSearchParams(window.location.search);
const requestedSkill = params.get("skill") || "HTML";
const skillKey = Object.keys(lessons).find(
    key => key.toLowerCase() === requestedSkill.trim().toLowerCase()
);
const lesson = lessons[skillKey] || {
    title: requestedSkill + " — Learning Lesson",
    intro: "A full lesson for this topic has not been added yet.",
    content: "<p>We will add a topic-specific lesson and practice questions next.</p>",
    question: "Is this lesson's full content available yet?",
    options: ["Yes", "Not yet"],
    answer: 1
};

document.title = "SkillForge-AI | " + lesson.title;
document.getElementById("lessonTitle").textContent = lesson.title;
document.getElementById("lessonIntro").textContent = lesson.intro;
document.getElementById("lessonContent").innerHTML = lesson.content;
document.getElementById("quizQuestion").textContent = lesson.question;

const optionsBox = document.getElementById("quizOptions");
lesson.options.forEach((option, index) => {
    const label = document.createElement("label");
    label.style.display = "block";
    label.style.margin = "10px 0";

    const radio = document.createElement("input");
    radio.type = "radio";
    radio.name = "lessonAnswer";
    radio.value = index;

    label.append(radio, " " + option);
    optionsBox.appendChild(label);
});

let quizPassed = false;

document.getElementById("checkAnswerBtn").addEventListener("click", () => {
    const selected = document.querySelector('input[name="lessonAnswer"]:checked');
    const feedback = document.getElementById("quizFeedback");

    if (!selected) {
        feedback.textContent = "Choose an answer first.";
        return;
    }

    quizPassed = Number(selected.value) === lesson.answer;
    feedback.textContent = quizPassed
        ? "Correct! You can complete this lesson."
        : "Not quite. Review the lesson and try again.";

    document.getElementById("completeLessonBtn").disabled = !quizPassed;
    document.getElementById("progressMessage").textContent = quizPassed
        ? "Practice passed. You can now mark this lesson as completed."
        : "Answer the practice question correctly to continue.";
});


document.getElementById("completeLessonBtn").addEventListener("click", async () => {
    if (!quizPassed) return;

    const message = document.getElementById("message");
    const button = document.getElementById("completeLessonBtn");

    const token = localStorage.getItem("skillforgeToken");

    let user;

    try {
        user = JSON.parse(localStorage.getItem("skillforgeUser") || "null");
    } catch {
        user = null;
    }

    const userId = user?.id || user?._id;

    if (!token || !userId) {
        message.textContent = "Please log in again to save your progress.";
        return;
    }

    button.disabled = true;
    button.textContent = "Saving...";
    message.textContent = "Saving your learning progress...";

    try {
        const response = await fetch(
            `https://skillforge-api-45.onrender.com/api/users/${encodeURIComponent(userId)}/learning-progress`,
            {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`
                },
                body: JSON.stringify({
                    skill: skillKey || requestedSkill.trim(),
                    status: "completed",
                    progress: 100
                })
            }
        );

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
            throw new Error(data.message || "Could not save lesson progress.");
        }

        message.textContent = "✓ Lesson completed! Your progress has been saved.";
        button.textContent = "Completed ✓";
        localStorage.setItem(
    "skillforgeProgressUpdated",
    Date.now().toString()
);
    } catch (error) {
        console.error("Lesson completion error:", error);
        message.textContent = error.message || "Unable to save progress. Please try again.";
        button.disabled = false;
        button.textContent = "Mark as Completed";
    }
});
